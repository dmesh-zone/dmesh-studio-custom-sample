    - kind: DataContract
      id: e87611c2-76b4-567a-8c61-c81b36e7831a
      status: active
      version: "1"
      apiVersion: v3.0.1
      servers:
        - server: Petstore workspace
          type: databricks
          environment: dev
          host: https://github.com/dmesh-zone/dmesh-studio/blob/main/README.md
          catalog: petstore
          schema: retail_data
        - server: Petstore workspace
          type: databricks
          environment: qa
          host: https://github.com/dmesh-zone/dmesh-studio/blob/main/README.md
          catalog: petstore
          schema: retail_data
        - server: Petstore workspace
          type: databricks
          environment: prod
          host: https://github.com/dmesh-zone/dmesh-studio/blob/main/README.md
          catalog: petstore
          schema: retail_data
      roles:
        - role: dataAnalyst01
          access: read
        - role: dataEngineer01
          access: write
      schema:
        - name: customers
          physicalType: table
          description: Petstore X operational data for customers
          customProperties:
            - property: technology
              value: deltalake
          properties:
            - name: customer_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              primaryKey: true
              examples:
                - PSTA-C-001
              quality:
                - dimension: completeness
                  type: library
                  metric: nullValues
                  mustBe: 0
            - name: first_name
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - John
              quality:
                - dimension: completeness
                  type: library
                  metric: nullValues
                  mustBe: 0
            - name: last_name
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - Smith
            - name: email
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - john.smith@email.com
              quality:
                - dimension: conformity
                  type: library
                  metric: invalidValues
                  mustBe: 0
            - name: phone
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - +1-555-0101
            - name: registration_date
              logicalType: date
              physicalType: DATE
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 2024-01-15
        - name: orders
          physicalType: table
          description: Petstore X operational data for orders
          customProperties:
            - property: technology
              value: deltalake
          properties:
            - name: order_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              primaryKey: true
              examples:
                - PSTA-ORD-001
              quality:
                - dimension: uniqueness
                  type: library
                  metric: duplicateValues
                  mustBe: 0
            - name: customer_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - PSTA-C-001
              quality:
                - dimension: completeness
                  type: library
                  metric: nullValues
                  mustBe: 0
              relationships:
                - to: customers.customer_id
                  type: foreignKey
            - name: order_date
              logicalType: timestamp
              physicalType: TIMESTAMP
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 2024-06-01T10:30:00Z
              quality:
                - dimension: timeliness
                  type: sql
                  mustBe: 0
                  query: order_date <= CURRENT_TIMESTAMP()
            - name: total_amount
              logicalType: number
              physicalType: DECIMAL(10,2)
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 125.5
              quality:
                - dimension: conformity
                  type: sql
                  mustBe: 0
                  query: total_amount >= 0
            - name: status
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - completed
              quality:
                - dimension: conformity
                  type: sql
                  mustBe: 0
                  query: status IN ('pending', 'completed', 'cancelled')
        - name: order_items
          physicalType: table
          description: Petstore X operational data for order_items
          customProperties:
            - property: technology
              value: deltalake
          properties:
            - name: order_item_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              primaryKey: true
              examples:
                - PSTA-OI-001
            - name: order_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - PSTA-ORD-001
              relationships:
                - to: orders.order_id
                  type: foreignKey
            - name: product_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - PSTA-PRD-001
              relationships:
                - to: products.product_id
                  type: foreignKey
            - name: quantity
              logicalType: integer
              physicalType: INT
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 2
              quality:
                - dimension: conformity
                  type: sql
                  mustBe: 0
                  query: quantity > 0
            - name: unit_price
              logicalType: number
              physicalType: DECIMAL(10,2)
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 29.99
        - name: products
          physicalType: table
          description: Petstore X operational data for products
          customProperties:
            - property: technology
              value: deltalake
          properties:
            - name: product_id
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              primaryKey: true
              examples:
                - PSTA-PRD-001
            - name: product_name
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - Premium Dog Food
              quality:
                - dimension: completeness
                  type: library
                  metric: nullValues
                  mustBe: 0
            - name: category
              logicalType: string
              physicalType: STRING
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - dog_food
            - name: price
              logicalType: number
              physicalType: DECIMAL(10,2)
              customProperties:
                - property: technology
                  value: deltalake
              examples:
                - 29.99
              quality:
                - dimension: conformity
                  type: sql
                  mustBe: 0
